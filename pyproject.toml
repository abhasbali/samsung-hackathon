[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codefusion"
version = "1.0.0"
description = "Code-intelligence retrieval engine: AST-aware chunking, code embeddings, code-aware BM25, symbols, code graph, adaptive fusion, version-aware and evolutionary retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CodeFusion team" }]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "bm25s>=0.2.0",
    "PyStemmer>=2.2",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-go>=0.23",
    "rustworkx>=0.14",
    "networkx>=3.0",
    "faiss-cpu>=1.8",
    "gitpython>=3.1",
    "psutil>=5.9",
]

[project.optional-dependencies]
models = ["torch>=2.2", "transformers>=4.44", "sentence-transformers>=3.0", "einops>=0.7"]
eval = ["mteb>=2.0", "datasets>=2.19"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
storage = ["pandas>=2.0", "pyarrow>=14"]
tracking = ["mlflow-skinny>=2.10"]
neo4j = ["neo4j>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = ["codefusion[models,eval,api,storage,tracking,dev]"]

[project.scripts]
codefusion-index = "codefusion.cli:index_main"
codefusion-search = "codefusion.cli:search_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that download models or datasets (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "B023"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"evaluate.py" = ["E402"]
