name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "0"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch, no model downloads)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Lint
        run: ruff check src tests scripts evaluate.py
      - name: Import checks (core must import without optional services)
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import codefusion.retrieval.pipeline, codefusion.api.main, codefusion.evaluation.official, codefusion.experimental.joern, codefusion.experimental.late_interaction, codefusion.graph.neo4j_adapter; print('imports ok')"
      - name: Validate configs
        run: |
          python -c "import sys, glob; sys.path.insert(0, 'src'); from codefusion.config import load_config; [print(p, load_config(p).name) for p in sorted(glob.glob('configs/*.yaml'))]"
      - name: Tests
        run: pytest -q -p no:cacheprovider
      - name: Retrieval smoke test (hashing embeddings, sample repo)
        run: |
          python scripts/index_repo.py examples/sample_repo --config configs/test_tiny.yaml --index-dir artifacts/index_ci
          python scripts/search.py --config configs/test_tiny.yaml --index-dir artifacts/index_ci -q "Who calls validate_user?" -q "Where is MAX_RETRIES configured?" --top-k 3
      - name: Versioning smoke test
        run: python scripts/benchmark_versions.py --config configs/test_tiny.yaml --out artifacts/ci_bench

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t codefusion:ci .
