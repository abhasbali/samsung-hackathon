# docker compose up                      -> API + UI on http://localhost:8000
# docker compose --profile neo4j up      -> also starts Neo4j for graph visualisation (optional)
services:
  codefusion:
    build: .
    ports: ["8000:8000"]
    env_file: [.env.example]
    environment:
      CODEFUSION_CONFIG: /app/configs/${CODEFUSION_CONFIG_NAME:-full}.yaml
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./artifacts:/app/artifacts

  neo4j:
    image: neo4j:5
    profiles: ["neo4j"]
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-codefusion}
    volumes:
      - neo4j-data:/data

volumes:
  hf-cache:
  neo4j-data:
